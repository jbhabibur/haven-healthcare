{% extends 'base.html' %}

{% block content %}
<div x-data="appointmentWorkflow({
    isLoggedIn: {{ request.user.is_authenticated|yesno:"true,false" }},
    patientName: '{{ request.user.get_full_name|default:request.user.username }}',
    patientPhone: '{{ request.user.patient_profile.phone_number|default:"" }}'
})" class="min-h-[80vh] flex flex-col items-center justify-center bg-surface px-4 py-12">

    <div class="bg-surface-muted p-8 rounded-2xl shadow-soft border border-border max-w-md w-full transition-all duration-300">
        
        <div class="mb-6 text-center">
            <h1 class="text-xl font-bold text-text-main">Dr. {{ doctor_name }}</h1>
            <p class="text-sm text-text-muted">Available Slots</p>
        </div>

        <button hx-get="{% url 'appointments:check_slots' %}?doctor={{ request.GET.doctor }}" 
                hx-target="#slot-section" 
                hx-swap="outerHTML"
                class="w-full bg-primary hover:opacity-90 text-white font-medium py-3 rounded-xl shadow-sm transition-colors cursor-pointer mb-6">
            Refresh Availability
        </button>

        <hr class="border-border mb-6">

        <form method="POST" action="{% url 'appointments:book_appointment' %}" id="appointmentForm">
            {% csrf_token %}
            <input type="hidden" name="doctor" value="{{ request.GET.doctor }}">
            
            <div class="space-y-5">
                <!-- User Details Section -->
                {% include 'includes/patient_info.html' %}

                {% include 'includes/slots_partial.html' %}

                <div>
                    <label class="block text-sm font-medium text-text-main mb-1.5">Symptoms</label>
                    <textarea name="symptoms" rows="3" required class="w-full px-4 py-2.5 bg-surface border border-border rounded-xl focus:ring-2 focus:ring-primary outline-none text-text-main resize-none"></textarea>
                </div>

                <button type="submit" class="w-full bg-secondary hover:opacity-90 text-white font-medium py-3 rounded-xl shadow-sm transition-colors mt-2 cursor-pointer">
                    Submit Appointment Request
                </button>
            </div>
        </form>
    </div>
</div>


<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('appointmentWorkflow', (config) => ({
            isLoggedIn: config.isLoggedIn || false,
            patientName: config.patientName || '',
            patientPhone: config.patientPhone || '',
            isEditingPhone: false,

            togglePhoneEdit() {
                this.isEditingPhone = !this.isEditingPhone;
            }
        }));
    });
</script>

{% endblock %}
