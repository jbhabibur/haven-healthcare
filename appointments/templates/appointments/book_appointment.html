{% extends 'base.html' %}

{% block content %}
<div x-data="appointmentWorkflow({
    isLoggedIn: {{ request.user.is_authenticated|yesno:"true,false" }},
    patientName: '{{ request.user.get_full_name|default:request.user.username }}',
    patientPhone: '{{ request.user.patient_profile.phone_number|default:"" }}'
})" class="min-h-[80vh] flex flex-col items-center justify-center bg-surface px-4 py-12">

    <div class="bg-surface-muted p-8 rounded-2xl shadow-soft border border-border max-w-md w-full transition-all duration-300">
        
        <div class="flex items-center justify-center mb-8 relative">
            <div class="absolute left-[25%] right-[25%] top-5 h-0.5 bg-border -z-0">
                <div :class="currentStep >= 2 ? 'w-full bg-primary' : 'w-0 bg-border'" class="h-full transition-all duration-300"></div>
            </div>

            <div class="flex flex-col items-center z-10">
                <div :class="currentStep >= 1 ? 'bg-primary text-white ring-4 ring-primary/10' : 'bg-surface text-text-muted'" 
                     class="w-10 h-10 rounded-full flex items-center justify-center font-semibold transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1.5 1.5 0 001.5 1.5H19a1.5 1.5 0 001.5-1.5V10M9 21h6M9 12h6"></path></svg>
                </div>
            </div>

            <div class="flex flex-col items-center z-10 ml-28">
                <div :class="currentStep >= 2 ? 'bg-primary text-white ring-4 ring-primary/10' : 'bg-surface text-text-muted'" 
                     class="w-10 h-10 rounded-full flex items-center justify-center font-semibold transition-all">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </div>
        </div>

        <form method="POST" action="{% url 'appointments:book_appointment' %}" id="appointmentForm">
            {% csrf_token %}

            <input type="hidden" name="doctor" x-model="selectedDoctor">
            <input type="hidden" name="slot" x-model="selectedSlot">
            <input type="hidden" name="guest_name" x-model="guestName">
            <input type="hidden" name="guest_phone" x-model="guestPhone">

            <template x-if="!isLoggedIn && currentStep === 1">
                <div x-transition:enter="transition ease-out duration-300" class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-text-main mb-1.5">Enter Your Name</label>
                        <input type="text" x-model="guestName" placeholder="Enter Your Name"
                               class="w-full px-4 py-2.5 bg-surface border border-border rounded-xl focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder-text-muted/60 text-text-main">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-text-main mb-1.5">Enter Your Phone Number</label>
                        <input type="tel" x-model="guestPhone" placeholder="Enter Your Phone Number"
                               class="w-full px-4 py-2.5 bg-surface border border-border rounded-xl focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder-text-muted/60 text-text-main">
                    </div>

                    <button type="button" @click="sendOTP()" 
                            class="w-full bg-primary hover:opacity-90 text-white font-medium py-3 rounded-xl shadow-sm transition-colors mt-2">
                        Get OTP
                    </button>
                </div>
            </template>

            <template x-if="!isLoggedIn && currentStep === 1.5">
                <div x-transition:enter="transition ease-out duration-300" class="text-center space-y-4">
                    <p class="text-sm text-text-muted">We sent a verification code to <span class="font-semibold text-text-main" x-text="guestPhone"></span></p>
                    <input type="text" x-model="otpCode" placeholder="••••" maxlength="4"
                           class="w-32 px-4 py-2.5 border-2 border-dashed border-border rounded-xl text-center text-2xl tracking-widest font-bold focus:border-primary focus:ring-0 outline-none text-text-main">
                    
                    <div class="flex space-x-3 mt-4">
                        <button type="button" @click="currentStep = 1" class="w-1/3 bg-surface hover:bg-border text-text-main font-medium py-2.5 rounded-xl transition-colors text-sm">Back</button>
                        <button type="button" @click="verifyOTP()" class="w-2/3 bg-primary hover:opacity-90 text-white font-medium py-2.5 rounded-xl shadow-sm transition-colors text-sm">Verify & Proceed</button>
                    </div>
                </div>
            </template>

            <template x-if="currentStep === 2">
                <div x-transition:enter="transition ease-out duration-300" class="space-y-5">
                    
                    <template x-if="isLoggedIn">
                        <div class="bg-primary/5 p-4 rounded-xl border border-primary/10 mb-2 space-y-3">
                            <p class="text-sm text-primary font-medium">Booking as: <span class="font-bold text-text-main" x-text="patientName"></span></p>
                            
                            <div class="space-y-2">
                                <label class="text-xs text-text-muted font-medium block">Phone Number:</label>
                                <div class="flex items-center gap-2">
                                    <input type="tel" x-model="patientPhone" x-ref="phoneField"
                                           :readonly="!isEditingPhone"
                                           :class="isEditingPhone ? 'bg-white border-primary ring-2 ring-primary/20' : 'bg-surface border-transparent select-none cursor-not-allowed'"
                                           class="text-sm font-semibold text-text-main px-3 py-2 rounded-xl border outline-none transition-all w-full"
                                           placeholder="Provide phone number">
                                    
                                    <button type="button" @click="togglePhoneEdit()" class="text-xs font-medium px-3 py-2 rounded-xl transition-all whitespace-nowrap border"
                                        :style="isEditingPhone ? 'background-color: var(--color-secondary); color: #ffffff; border-color: var(--color-secondary);' : 'background-color: var(--color-surface); color: var(--color-text-main); border-color: var(--color-border);'"
                                        @mouseenter="$el.style.opacity = '0.9'"
                                        @mouseleave="$el.style.opacity = '1'">
                                        <span x-text="isEditingPhone ? 'Save' : 'Update'"></span>
                                    </button>
                                </div>
                                <p x-show="phoneError" class="text-xs text-error font-medium" x-text="phoneError"></p>
                            </div>
                        </div>
                    </template>

                    <template x-if="!isLoggedIn">
                        <div class="bg-secondary/5 p-4 rounded-xl border border-secondary/10 mb-2">
                            <p class="text-sm text-secondary font-medium">Booking as Guest: <span class="font-bold text-text-main" x-text="guestName"></span></p>
                            <p class="text-xs text-text-muted" x-text="'Verified Phone: ' + guestPhone"></p>
                        </div>
                    </template>

                    <div>
                        <label class="block text-sm font-medium text-text-main mb-1.5">Preferred Date</label>
                        <input type="date" name="preferred_date" required
                               class="w-full px-4 py-2.5 bg-surface border border-border rounded-xl focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all text-text-main">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-text-main mb-1.5">Briefly Describe Your Symptoms</label>
                        <textarea name="symptoms" rows="3" required placeholder="e.g., Severe headache, fever for 2 days..."
                                  class="w-full px-4 py-2.5 bg-surface border border-border rounded-xl focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder-text-muted/60 text-text-main resize-none"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-text-main mb-1.5">Preferred Time & Notes (Optional)</label>
                        <input type="text" name="preferred_time_notes" placeholder="e.g., Evening slot preferred"
                               class="w-full px-4 py-2.5 bg-surface border border-border rounded-xl focus:bg-white focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder-text-muted/60 text-text-main">
                    </div>

                    <button type="submit" 
                            class="w-full bg-secondary hover:opacity-90 text-white font-medium py-3 rounded-xl shadow-sm transition-colors mt-2">
                        Submit Appointment Request
                    </button>
                </div>
            </template>
        </form>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('appointmentWorkflow', (config) => ({
        isLoggedIn: false,
        currentStep: 1,
        patientName: '',
        patientPhone: '',
        guestName: '',
        guestPhone: '',
        otpCode: '',
        
        selectedDoctor: '',
        selectedSlot: '',
        
        isEditingPhone: false,
        phoneError: '',

        init() {
            // 🛠️ এখানে পরিবর্তন: ইউআরএল থেকে ডাটা রিড করার প্রসেসটি init() এর ভেতরে নিয়ে আসা হয়েছে
            const urlParams = new URLSearchParams(window.location.search);
            this.selectedDoctor = urlParams.get('doctor') || '';
            this.selectedSlot = urlParams.get('slot') || '';

            // 🔴 ডিবাগিং লগ (এটি যোগ করুন)
    console.log("=== URL Debugger ===");
    console.log("Full URL Search:", window.location.search);
    console.log("Extracted Doctor ID:", this.selectedDoctor, "Type:", typeof this.selectedDoctor);
    console.log("Extracted Slot ID:", this.selectedSlot);

            if (config) {
                this.isLoggedIn = config.isLoggedIn;
                this.currentStep = config.isLoggedIn ? 2 : 1;
                this.patientName = config.patientName;
                this.patientPhone = config.patientPhone;
            }
        },

        sendOTP() {
            if(!this.guestName.trim() || !this.guestPhone.trim()) {
                alert('Please provide your name and valid phone number.');
                return;
            }
            this.currentStep = 1.5;
        },

        verifyOTP() {
            if(this.otpCode.length === 4) {
                this.currentStep = 2;
            } else {
                alert('Invalid Code! Try again.');
            }
        },

        async togglePhoneEdit() {
            if (this.isEditingPhone) {
                this.phoneError = '';
                if(!this.patientPhone.trim()) {
                    this.phoneError = 'Phone number cannot be empty.';
                    return;
                }

                try {
                    const response = await fetch("{% url 'accounts:update_phone' %}", {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': document.querySelector('[name=csrfmiddlewaretoken]').value
                        },
                        body: JSON.stringify({ phone_number: this.patientPhone })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        this.patientPhone = data.phone_number;
                        this.isEditingPhone = false;
                        alert('Phone number updated successfully!');
                    } else {
                        this.phoneError = data.error || 'Something went wrong.';
                    }
                } catch (error) {
                    this.phoneError = 'Network error. Please try again.';
                }
            } else {
                this.isEditingPhone = true;
                this.$nextTick(() => {
                    this.$refs.phoneField.focus();
                });
            }
        }
    }));
});
</script>
{% endblock %}
