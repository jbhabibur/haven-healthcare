{% comment %} templates/includes/messages.html {% endcomment %}
{% if messages %}
    <div class="max-w-6xl mx-auto mb-4">
        {% for message in messages %}
            <div class="{% if message.tags == 'error' %}bg-red-50 text-red-800 border-red-200{% else %}bg-blue-50 text-blue-800 border-blue-200{% endif %} px-4 py-3 rounded-lg border flex items-center justify-between shadow-sm">
                <div class="flex items-center gap-3">
                    {% if message.tags == 'error' %}
                        <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                    {% else %}
                        <i class="fa-solid fa-circle-info text-blue-500"></i>
                    {% endif %}
                    <span class="text-sm font-medium">{{ message }}</span>
                </div>
                <button type="button" onclick="this.parentElement.remove()" class="text-gray-400 hover:text-gray-600 transition-colors">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
        {% endfor %}
    </div>
{% endif %}
