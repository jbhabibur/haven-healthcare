<header class="w-full bg-surface-muted border-b border-border px-4 py-3 flex items-center justify-between gap-4 font-sans">
    
    <div class="flex items-center gap-4 shrink-0">
        <a href="{% url 'products:category_products' 'shop' %}" class="bg-secondary hover:opacity-90 text-white px-3 py-1.5 rounded-md text-sm font-medium transition-opacity">
            Shop
        </a>
        <a href="{% url 'home' %}" class="text-text-main text-lg font-normal hover:opacity-80 transition-opacity">
            Home
        </a>
    </div>

    <div class="flex-1 max-w-5xl mx-2">
        <form action="" method="GET" class="w-full">
            <input 
                type="text" 
                name="search" 
                value="{{ request.GET.search|default:'' }}"
                placeholder="Search doctor" 
                class="w-full bg-surface border border-border rounded-md px-4 py-2 text-base text-text-main placeholder-text-muted focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary"
            >
        </form>
    </div>

    <div class="shrink-0">
        {% if user.is_authenticated %}
            <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center text-white font-semibold text-lg cursor-pointer">
                {{ user.first_name|default:user.username|slice:":1"|upper }}
            </div>
        {% else %}
            <a href="{% url 'accounts:login' %}" class="bg-primary hover:opacity-95 text-white px-4 py-2 rounded-md text-base font-normal transition-opacity shadow-soft">
                Login
            </a>
        {% endif %}
    </div>
    
</header>
