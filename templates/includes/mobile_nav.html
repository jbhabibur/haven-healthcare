<!-- Mobile Header Wrapper -->
<div x-data="{ open: false }" class="relative">
    
    <!-- Top Bar -->
    <div class="flex items-center space-x-3 p-2 bg-white border-b border-gray-100">
        <!-- Hamburger Menu Button (Static Bars Icon) -->
        <button @click="open = true" 
                class="flex items-center justify-center w-10 h-10 text-primary focus:outline-none hover:text-accent hover:bg-slate-100 rounded-md transition-all duration-300">
            <i class="fa-solid fa-bars text-2xl"></i>
        </button>

        <!-- Mobile Search Bar -->
        <div class="flex-1 relative">
            <input type="text" 
                   placeholder="Search products..." 
                   class="w-full border border-gray-300 rounded-md py-1.5 pl-3 pr-10 text-sm focus:border-accent focus:ring-1 focus:ring-accent outline-none transition-all">
            <button class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-primary transition-colors">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <!-- Mobile Cart Icon -->
        <div class="relative group cursor-pointer w-fit">
            <a href="#" class="text-primary hover:text-accent transition-colors flex items-center justify-center">
                <div class="w-8 h-8 flex items-center justify-center">
                    <i class="fa-solid fa-cart-shopping text-xl"></i>
                </div>
                <span class="absolute -top-1.5 -right-2 bg-accent text-white text-[10px] font-bold rounded-full h-5 w-5 flex items-center justify-center border-2 border-white shadow-sm group-hover:scale-110 transition-transform">
                    0
                </span>
            </a>
        </div>

        <!-- User Signup -->
        <div class="relative group cursor-pointer w-fit" x-data="{ cartCount: 0 }">
            <a href="#" @click.prevent="console.log('Cart clicked')" class="text-primary hover:text-accent transition-colors flex items-center justify-center">
                <div class="w-8 h-8 flex items-center justify-center">
                    <i class="fa-solid fa-user"></i>
                </div>
            </a>
        </div>
    </div>

    <!-- Sidebar Overlay -->
    <div x-show="open" 
         x-transition:enter="transition opacity-ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition opacity-ease-in duration-300"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         @click="open = false"
         class="fixed inset-0 bg-black/50 z-40">
    </div>

    <!-- Sidebar Menu Content -->
    <div x-show="open"
         x-transition:enter="transition transform ease-out duration-300"
         x-transition:enter-start="-translate-x-full"
         x-transition:enter-end="translate-x-0"
         x-transition:leave="transition transform ease-in duration-300"
         x-transition:leave-start="translate-x-0"
         x-transition:leave-end="-translate-x-full"
         class="fixed top-0 left-0 h-full w-72 bg-white z-50 shadow-2xl overflow-y-auto">

        <!-- Sidebar Header (Static Close Button at the top) -->
        <div class="flex items-center justify-between p-4 border-b border-gray-100">
            <span class="font-bold text-slate-800">Menu</span>
            <button @click="open = false" class="text-slate-500 hover:text-accent transition-colors">
                <i class="fa-solid fa-xmark text-2xl"></i>
            </button>
        </div>
        
        <!-- Sidebar Content (Links) -->
        <div class="py-4 px-4">
            <nav class="space-y-1">
                <a href="#" class="block py-3 px-4 text-accent font-semibold bg-accent/5 rounded-md">Home</a>
                <a href="#" class="block py-3 px-4 text-slate-800 hover:bg-slate-50 transition-colors rounded-md">Shop</a>
                
                <!-- Category with Dropdown -->
                <div x-data="{ subOpen: false }">
                    <button @click="subOpen = !subOpen" class="w-full flex justify-between items-center py-3 px-4 text-slate-800 hover:bg-slate-50 transition-colors rounded-md">
                        <span>Unani Medicine</span>
                        <i class="fa-solid fa-chevron-down text-xs transition-transform duration-300" :class="subOpen ? 'rotate-180' : ''"></i>
                    </button>
                    <div x-show="subOpen" x-collapse class="pl-6 bg-slate-50 mt-1 rounded-md">
                        <a href="#" class="block py-2 text-slate-600 hover:text-accent">Women Health Care</a>
                        <a href="#" class="block py-2 text-slate-600 hover:text-accent">Bone & Joint Care</a>
                        <a href="#" class="block py-2 text-slate-600 hover:text-accent">Gastrointestinal Care</a>
                    </div>
                </div>

                <!-- Category with Dropdown -->
                <div x-data="{ subOpen: false }">
                    <button @click="subOpen = !subOpen" class="w-full flex justify-between items-center py-3 px-4 text-slate-800 hover:bg-slate-50 transition-colors rounded-md">
                        <span>Health & Wellness</span>
                        <i class="fa-solid fa-chevron-down text-xs transition-transform duration-300" :class="subOpen ? 'rotate-180' : ''"></i>
                    </button>
                    <div x-show="subOpen" x-collapse class="pl-6 bg-slate-50 mt-1 rounded-md">
                        <a href="#" class="block py-2 text-slate-600 hover:text-accent">Food Supplement</a>
                        <a href="#" class="block py-2 text-slate-600 hover:text-accent">Weight Loss</a>
                        <a href="#" class="block py-2 text-slate-600 hover:text-accent">Weight Gain</a>
                        <a href="#" class="block py-2 text-slate-600 hover:text-accent">Vitamins and Supplement</a>
                    </div>
                </div>

                <a href="#" class="block py-3 px-4 text-slate-800 hover:bg-slate-50 transition-colors rounded-md">Baby Care</a>
                <a href="#" class="block py-3 px-4 text-slate-800 hover:bg-slate-50 transition-colors rounded-md">Skin & Hair Care</a>
                <a href="#" class="block py-3 px-4 text-slate-800 hover:bg-slate-50 transition-colors rounded-md">Sexual Wellness</a>
            </nav>
        </div>
    </div>
</div>
