{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <!-- Meta tags for character encoding and responsive viewport -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>{% block title %} Haven Healthcare Center {% endblock title %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/logo.png' %}">

    <!-- External Icon Library: Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Project Stylesheet (Tailwind Output) -->
    <link rel="stylesheet" href="{% static 'dist/output.css' %}" />

    <!-- Alpine.js for interactive UI components (Dropdowns, Tabs, etc.) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  </head>
  
  <body class="flex flex-col min-h-screen font-sans text-slate-900 bg-white">
    
    <!-- Header: Navigation and Logo -->
    {% block header %}
        {% include "includes/header.html" %}
    {% endblock header %}

    <!-- Main Content Area: flex-grow ensures the footer stays at the bottom on short pages -->
    <main class="flex-grow">
        {% block content %}
        <!-- Child templates will inject their content here -->
        {% endblock content %}
    </main>

    <!-- Footer: Site links and Copyright info -->
    {% include "includes/footer.html" %}
    
  </body>
</html>
