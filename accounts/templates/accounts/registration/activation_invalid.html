{% extends "base.html" %} {% block content %}
<div style="max-width: 600px; margin: 50px auto; text-align: center; padding: 30px; border: 1px solid #f5c6cb; border-radius: 8px; background-color: #f8d7da;">
    <h2 style="color: #721c24;">Activation Link Invalid</h2>
    <p style="font-size: 16px; color: #721c24; margin-top: 15px;">
        The activation link is either invalid, broken, or has expired. 
    </p>
    <p style="color: #6c757d; font-size: 14px;">
        Please try registering again or contact support if you believe this is a mistake.
    </p>
    <div style="margin-top: 25px;">
        <a href="{% url 'accounts:signup' %}" style="display: inline-block; padding: 10px 20px; background-color: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold;">
            Back to Sign Up
        </a>
    </div>
</div>
{% endblock %}
