{% extends "base.html" %}

{% block title %}Password Reset Complete | Haven Healthcare{% endblock %}

{% block content %}
<div class="flex min-h-[80vh] items-center justify-center bg-[var(--color-surface)] p-4">
    
    <div class="w-full max-w-md rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface-muted)] p-8 shadow-[var(--shadow-soft)] text-center transition-all duration-300">
        
        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-emerald-500/10 text-emerald-500 rounded-full mb-4">
                <i class="fa-solid fa-circle-check text-2xl"></i>
            </div>
            <h2 class="text-3xl font-bold text-[var(--color-text-main)] tracking-tight">
                Password Reset Complete!
            </h2>
        </div>
        
        <p class="text-[var(--color-text-muted)] text-sm leading-relaxed mb-8">
            Your password has been successfully updated. You can now use your new credentials to log into your account.
        </p>

        <a href="{% url 'accounts:login' %}" 
           class="inline-block w-full text-center rounded-xl bg-[var(--color-primary)] p-3 font-semibold text-white transition-all duration-300 hover:bg-[var(--color-secondary)] active:scale-[0.98] shadow-md">
            Click here to log in
        </a>

    </div>
</div>
{% endblock %}
