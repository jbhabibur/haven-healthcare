<div x-show="openEditModal" 
     x-cloak 
     class="fixed inset-0 z-50 flex items-center justify-center overflow-x-hidden overflow-y-auto outline-none focus:outline-none" 
     style="display: none">
    
    <!-- Background Overlay -->
    <div @click="openEditModal = false" class="fixed inset-0 bg-black/50 transition-opacity"></div>

    <!-- Modal Box -->
    <div class="relative w-full max-w-lg mx-auto my-6 p-6 bg-surface rounded-xl shadow-xl border border-border z-10 max-h-[90vh] overflow-y-auto">
        <div class="flex items-center justify-between pb-4 border-b border-border">
            <h3 class="text-lg font-bold text-text-main cursor-pointer">✏️ Edit Patient Information</h3>
            <button @click="openEditModal = false" type="button" class="text-text-muted hover:text-text-main font-bold text-xl cursor-pointer">&times;</button>
        </div>

        <form method="POST" action="{% url 'accounts:update_patient_profile' %}" enctype="multipart/form-data" class="py-4 space-y-4">
            {% csrf_token %}

            <!-- Name Section -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-text-muted mb-1">First Name</label>
                    <input type="text" name="first_name" value="{{ patient_profile.user.first_name|default:'' }}" 
                           class="w-full px-3 py-2 bg-surface border border-border/80 rounded-lg text-sm text-text-main focus:ring-1 focus:ring-primary" required />
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-text-muted mb-1">Last Name</label>
                    <input type="text" name="last_name" value="{{ patient_profile.user.last_name|default:'' }}" 
                           class="w-full px-3 py-2 bg-surface border border-border/80 rounded-lg text-sm text-text-main focus:ring-1 focus:ring-primary" required />
                </div>
            </div>

            <!-- Blood Group and Age -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-text-muted mb-1">Blood Group</label>
                    <input type="text" name="blood_group" value="{{ patient_profile.blood_group|default:'' }}" 
                           class="w-full px-3 py-2 bg-surface border border-border/80 rounded-lg text-sm text-text-main focus:ring-1 focus:ring-primary" />
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-text-muted mb-1">Age</label>
                    <input type="number" name="age" value="{{ patient_profile.age|default:'' }}" 
                           class="w-full px-3 py-2 bg-surface border border-border/80 rounded-lg text-sm text-text-main focus:ring-1 focus:ring-primary" />
                </div>
            </div>

            <!-- Phone and Address -->
            <div>
                <label class="block text-xs font-semibold uppercase text-text-muted mb-1">Phone Number</label>
                <input type="tel" name="phone" value="{{ patient_profile.phone_number|default:'' }}" 
                       class="w-full px-3 py-2 bg-surface border border-border/80 rounded-lg text-sm text-text-main focus:ring-1 focus:ring-primary" />
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-text-muted mb-1">Address</label>
                <textarea name="address" rows="2" 
                          class="w-full px-3 py-2 bg-surface border border-border/80 rounded-lg text-sm text-text-main focus:ring-1 focus:ring-primary">{{ patient_profile.address|default:'' }}</textarea>
            </div>

            <div class="mt-6 pt-4 border-t border-border flex justify-end gap-3">
                <button @click="openEditModal = false" type="button" class="px-4 py-2 bg-surface border border-border rounded-lg cursor-pointer">Cancel</button>
                <button type="submit" class="px-4 py-2 bg-primary text-white rounded-lg shadow-sm cursor-pointer">Save Changes</button>
            </div>
        </form>
    </div>
</div>
